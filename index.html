<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Wallet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>

<body>
    <div class="header">
        <h1>Cipher Wallet Terminal</h1>
        <div class="header-controls">
            <div class="dropdown">
                Daily <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="date-picker">
                <i class="fa-solid fa-calendar"></i>
                9 september 2026
            </div>
            <div class="export-btn">
                <i class="fa-solid fa-download"></i>
                Export
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="dashboard-grid">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Monthly Income</h3>
                    <button class="card-menu"><i class="fa-solid fa-ellipsis"></i></button>
                </div>
                <div class="amount-income-amount">2.645.00</div>
                <div class="change">
                    <i class="fa-solid fa-arrow-up"></i>
                    12% vs last month
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Monthly Expenses</h3>
                    <button class="card-menu"><i class="fa-solid fa-ellipsis"></i></button>
                </div>
                <div class="amount-income-amount">1.895.00</div>
                <div class="change">
                    <i class="fa-solid fa-arrow-up"></i>
                    12% vs last month
                </div>
            </div>

        </div>
    </div>
</body> 

</html>
